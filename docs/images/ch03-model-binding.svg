<svg xmlns="http://www.w3.org/2000/svg" width="500" height="148" viewBox="0 0 500 148">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#333"/>
    </marker>
  </defs>
  <!-- 左テーブル: フォームフィールド -->
  <rect x="10" y="10" width="190" height="128" rx="4" fill="white" stroke="#6c8ebf" stroke-width="1.5"/>
  <rect x="10" y="10" width="190" height="30" rx="4" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="105" y="25" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#333" text-anchor="middle" dominant-baseline="middle">フォームフィールド</text>
  <line x1="10" y1="70" x2="200" y2="70" stroke="#6c8ebf" stroke-width="0.75"/>
  <line x1="10" y1="100" x2="200" y2="100" stroke="#6c8ebf" stroke-width="0.75"/>
  <text x="105" y="55" font-family="Courier New, monospace" font-size="11" fill="#333" text-anchor="middle" dominant-baseline="middle">name="name"</text>
  <text x="105" y="85" font-family="Courier New, monospace" font-size="11" fill="#333" text-anchor="middle" dominant-baseline="middle">name="salary"</text>
  <text x="105" y="119" font-family="Courier New, monospace" font-size="11" fill="#333" text-anchor="middle" dominant-baseline="middle">name="hire_date"</text>

  <!-- 矢印 (3本) -->
  <line x1="202" y1="55" x2="296" y2="55" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="202" y1="85" x2="296" y2="85" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="202" y1="119" x2="296" y2="119" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 右テーブル: Employee プロパティ -->
  <rect x="300" y="10" width="190" height="128" rx="4" fill="white" stroke="#82b366" stroke-width="1.5"/>
  <rect x="300" y="10" width="190" height="30" rx="4" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <text x="395" y="25" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#333" text-anchor="middle" dominant-baseline="middle">Employee プロパティ</text>
  <line x1="300" y1="70" x2="490" y2="70" stroke="#82b366" stroke-width="0.75"/>
  <line x1="300" y1="100" x2="490" y2="100" stroke="#82b366" stroke-width="0.75"/>
  <text x="395" y="55" font-family="Courier New, monospace" font-size="11" fill="#333" text-anchor="middle" dominant-baseline="middle">employee.Name</text>
  <text x="395" y="85" font-family="Courier New, monospace" font-size="11" fill="#333" text-anchor="middle" dominant-baseline="middle">employee.Salary</text>
  <text x="395" y="119" font-family="Courier New, monospace" font-size="11" fill="#333" text-anchor="middle" dominant-baseline="middle">employee.HireDate</text>
</svg>
