<svg xmlns="http://www.w3.org/2000/svg" width="500" height="220" viewBox="0 0 500 220">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#333"/>
    </marker>
  </defs>
  <!-- Controller -->
  <rect x="20" y="25" width="130" height="110" rx="4" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <text x="85" y="62" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#333" text-anchor="middle" dominant-baseline="middle">Controller</text>
  <text x="85" y="82" font-family="Arial, sans-serif" font-size="10" fill="#555" text-anchor="middle">リクエストを</text>
  <text x="85" y="96" font-family="Arial, sans-serif" font-size="10" fill="#555" text-anchor="middle">受け取る</text>
  <!-- Model -->
  <rect x="185" y="25" width="130" height="110" rx="4" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
  <text x="250" y="62" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#333" text-anchor="middle" dominant-baseline="middle">Model</text>
  <text x="250" y="82" font-family="Arial, sans-serif" font-size="10" fill="#555" text-anchor="middle">データを</text>
  <text x="250" y="96" font-family="Arial, sans-serif" font-size="10" fill="#555" text-anchor="middle">表す</text>
  <!-- View -->
  <rect x="350" y="25" width="130" height="110" rx="4" fill="#f8cecc" stroke="#b85450" stroke-width="1.5"/>
  <text x="415" y="62" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#333" text-anchor="middle" dominant-baseline="middle">View</text>
  <text x="415" y="82" font-family="Arial, sans-serif" font-size="10" fill="#555" text-anchor="middle">データを HTML に</text>
  <text x="415" y="96" font-family="Arial, sans-serif" font-size="10" fill="#555" text-anchor="middle">変換して返す</text>
  <!-- Controller → Model -->
  <line x1="151" y1="80" x2="184" y2="80" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- Model → View -->
  <line x1="316" y1="80" x2="349" y2="80" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- ブラウザ (below Controller) -->
  <rect x="25" y="158" width="120" height="34" rx="17" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="85" y="175" font-family="Arial, sans-serif" font-size="11" fill="#333" text-anchor="middle" dominant-baseline="middle">ブラウザ</text>
  <!-- Arrow ↑: ブラウザ → Controller -->
  <line x1="85" y1="156" x2="85" y2="137" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- PostgreSQL (below Model) -->
  <rect x="190" y="158" width="120" height="44" rx="4" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/>
  <text x="250" y="173" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#333" text-anchor="middle" dominant-baseline="middle">PostgreSQL</text>
  <text x="250" y="191" font-family="Arial, sans-serif" font-size="10" fill="#555" text-anchor="middle" dominant-baseline="middle">（Dapper 経由）</text>
  <!-- Arrow ↓: Model → PostgreSQL -->
  <line x1="250" y1="137" x2="250" y2="156" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
</svg>
