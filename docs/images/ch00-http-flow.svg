<svg xmlns="http://www.w3.org/2000/svg" width="560" height="270" viewBox="0 0 560 270">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#333"/>
    </marker>
  </defs>
  <text x="85" y="22" font-family="Arial, sans-serif" font-size="11" fill="#777" text-anchor="middle">あなたのPC</text>
  <text x="415" y="22" font-family="Arial, sans-serif" font-size="11" fill="#777" text-anchor="middle">サーバー</text>
  <!-- ブラウザ -->
  <rect x="20" y="34" width="130" height="110" rx="4" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="85" y="89" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333" text-anchor="middle" dominant-baseline="middle">ブラウザ</text>
  <!-- ASP.NET Core -->
  <rect x="310" y="34" width="210" height="110" rx="4" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <text x="415" y="80" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#333" text-anchor="middle" dominant-baseline="middle">ASP.NET Core</text>
  <text x="415" y="100" font-family="Arial, sans-serif" font-size="11" fill="#555" text-anchor="middle" dominant-baseline="middle">アプリケーション</text>
  <!-- PostgreSQL -->
  <rect x="310" y="192" width="210" height="62" rx="4" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/>
  <text x="415" y="215" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#333" text-anchor="middle" dominant-baseline="middle">PostgreSQL</text>
  <text x="415" y="235" font-family="Arial, sans-serif" font-size="11" fill="#555" text-anchor="middle" dominant-baseline="middle">データベース</text>
  <!-- ① HTTPリクエスト -->
  <line x1="152" y1="76" x2="308" y2="76" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="230" y="68" font-family="Arial, sans-serif" font-size="10" fill="#555" text-anchor="middle">① HTTP リクエスト</text>
  <!-- ④ HTTPレスポンス -->
  <line x1="308" y1="122" x2="152" y2="122" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="230" y="114" font-family="Arial, sans-serif" font-size="10" fill="#555" text-anchor="middle">④ HTTP レスポンス（HTML が返ってくる）</text>
  <!-- ② SQLクエリ -->
  <line x1="400" y1="146" x2="400" y2="190" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="396" y="170" font-family="Arial, sans-serif" font-size="10" fill="#555" text-anchor="end">② SQL クエリ</text>
  <!-- ③ 結果 -->
  <line x1="432" y1="190" x2="432" y2="146" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="436" y="170" font-family="Arial, sans-serif" font-size="10" fill="#555" text-anchor="start">③ 結果</text>
</svg>
