<svg xmlns="http://www.w3.org/2000/svg" width="540" height="248" viewBox="0 0 540 248">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#333"/>
    </marker>
    <marker id="arr-r" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#b85450"/>
    </marker>
  </defs>
  <!-- タイトル -->
  <text x="270" y="20" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#b85450" text-anchor="middle">❌ PRG なし（NG）</text>
  <!-- アクター -->
  <rect x="20" y="30" width="110" height="36" rx="18" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="75" y="48" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333" text-anchor="middle" dominant-baseline="middle">ブラウザ</text>
  <rect x="410" y="30" width="110" height="36" rx="4" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <text x="465" y="48" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333" text-anchor="middle" dominant-baseline="middle">Controller</text>
  <!-- ライフライン -->
  <line x1="75" y1="68" x2="75" y2="200" stroke="#aaa" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="465" y1="68" x2="465" y2="200" stroke="#aaa" stroke-width="1" stroke-dasharray="4,4"/>
  <!-- ステップ1: POST -->
  <line x1="77" y1="90" x2="463" y2="90" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="270" y="82" font-family="Arial, sans-serif" font-size="10" fill="#333" text-anchor="middle">POST /Employee/Create</text>
  <!-- INSERT note -->
  <text x="468" y="115" font-family="Arial, sans-serif" font-size="10" fill="#555" dominant-baseline="middle">INSERT 実行</text>
  <!-- ステップ2: return View (問題) -->
  <line x1="463" y1="140" x2="77" y2="140" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr-r)"/>
  <text x="270" y="132" font-family="Arial, sans-serif" font-size="10" fill="#b85450" text-anchor="middle">return View() ← HTML を直接返す</text>
  <!-- 区切り線 -->
  <line x1="20" y1="163" x2="520" y2="163" stroke="#f8cecc" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="270" y="176" font-family="Arial, sans-serif" font-size="10" fill="#b85450" font-style="italic" text-anchor="middle">⚠ ブラウザをリロードすると...</text>
  <!-- ステップ3: 再送信 (問題) -->
  <line x1="77" y1="198" x2="463" y2="198" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-r)"/>
  <text x="270" y="190" font-family="Arial, sans-serif" font-size="10" fill="#b85450" text-anchor="middle">「再送信しますか？」→ 同じ INSERT が再実行される！</text>
</svg>
