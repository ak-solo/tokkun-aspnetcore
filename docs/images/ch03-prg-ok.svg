<svg xmlns="http://www.w3.org/2000/svg" width="540" height="285" viewBox="0 0 540 285">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#333"/>
    </marker>
  </defs>
  <!-- タイトル -->
  <text x="270" y="20" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#6c8ebf" text-anchor="middle">✅ PRG あり（OK）</text>
  <!-- アクター -->
  <rect x="20" y="30" width="110" height="36" rx="18" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="75" y="48" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333" text-anchor="middle" dominant-baseline="middle">ブラウザ</text>
  <rect x="410" y="30" width="110" height="36" rx="4" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <text x="465" y="48" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333" text-anchor="middle" dominant-baseline="middle">Controller</text>
  <!-- ライフライン -->
  <line x1="75" y1="68" x2="75" y2="248" stroke="#aaa" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="465" y1="68" x2="465" y2="248" stroke="#aaa" stroke-width="1" stroke-dasharray="4,4"/>
  <!-- ステップ1: POST -->
  <line x1="77" y1="88" x2="463" y2="88" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="270" y="80" font-family="Arial, sans-serif" font-size="10" fill="#333" text-anchor="middle">POST /Employee/Create</text>
  <!-- INSERT note -->
  <text x="468" y="111" font-family="Arial, sans-serif" font-size="10" fill="#555" dominant-baseline="middle">INSERT 実行</text>
  <!-- ステップ2: 302 Redirect -->
  <line x1="463" y1="132" x2="77" y2="132" stroke="#d6b656" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="270" y="124" font-family="Arial, sans-serif" font-size="10" fill="#a07800" text-anchor="middle">302 Redirect → /Employee/Details/id</text>
  <!-- ステップ3: GET -->
  <line x1="77" y1="168" x2="463" y2="168" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="270" y="160" font-family="Arial, sans-serif" font-size="10" fill="#333" text-anchor="middle">GET /Employee/Details/5</text>
  <!-- ステップ4: return View -->
  <line x1="463" y1="206" x2="77" y2="206" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="270" y="198" font-family="Arial, sans-serif" font-size="10" fill="#333" text-anchor="middle">return View() ← HTML を返す</text>
  <!-- 区切り線 + 補足 -->
  <line x1="20" y1="226" x2="520" y2="226" stroke="#d5e8d4" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="270" y="248" font-family="Arial, sans-serif" font-size="10" fill="#82b366" font-style="italic" text-anchor="middle">✓ リロードしても GET リクエストになるため INSERT は再実行されない</text>
</svg>
