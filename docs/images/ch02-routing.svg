<svg xmlns="http://www.w3.org/2000/svg" width="490" height="285" viewBox="0 0 490 285">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#555"/>
    </marker>
  </defs>
  <!-- URL ブラウザ pill -->
  <rect x="135" y="15" width="220" height="40" rx="20" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="245" y="35" font-family="Arial, sans-serif" font-size="12" fill="#333" text-anchor="middle" dominant-baseline="middle">/Employee/Details/3 にアクセス</text>
  <!-- Arrow 1 -->
  <line x1="245" y1="57" x2="245" y2="85" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="253" y="73" font-family="Arial, sans-serif" font-size="10" fill="#555" text-anchor="start">ASP.NET Core のルーティング</text>
  <!-- ルーティング解析ボックス -->
  <rect x="10" y="87" width="470" height="112" rx="4" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <text x="30" y="118" font-family="Courier New, monospace" font-size="12" fill="#333" dominant-baseline="middle">{controller} = Employee</text>
  <text x="290" y="118" font-family="Arial, sans-serif" font-size="12" fill="#555" dominant-baseline="middle">→  EmployeeController</text>
  <line x1="10" y1="130" x2="480" y2="130" stroke="#82b366" stroke-width="0.75" stroke-dasharray="4,3"/>
  <text x="30" y="152" font-family="Courier New, monospace" font-size="12" fill="#333" dominant-baseline="middle">{action}     = Details</text>
  <text x="290" y="152" font-family="Arial, sans-serif" font-size="12" fill="#555" dominant-baseline="middle">→  Details() メソッド</text>
  <line x1="10" y1="164" x2="480" y2="164" stroke="#82b366" stroke-width="0.75" stroke-dasharray="4,3"/>
  <text x="30" y="186" font-family="Courier New, monospace" font-size="12" fill="#333" dominant-baseline="middle">{id}         = 3</text>
  <text x="290" y="186" font-family="Arial, sans-serif" font-size="12" fill="#555" dominant-baseline="middle">→  int id パラメータに 3 が入る</text>
  <!-- Arrow 2 -->
  <line x1="245" y1="201" x2="245" y2="229" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- 結果ボックス -->
  <rect x="10" y="231" width="470" height="40" rx="20" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="245" y="251" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333" text-anchor="middle" dominant-baseline="middle">EmployeeController.Details(int id = 3) が呼ばれる</text>
</svg>
