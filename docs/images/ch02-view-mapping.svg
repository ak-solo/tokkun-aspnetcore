<svg xmlns="http://www.w3.org/2000/svg" width="500" height="135" viewBox="0 0 500 135">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#333"/>
    </marker>
  </defs>
  <!-- 左ボックス: Controller -->
  <rect x="10" y="10" width="195" height="110" rx="4" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <rect x="10" y="10" width="195" height="28" rx="4" fill="#82b366"/>
  <text x="107" y="24" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle" dominant-baseline="middle">Controller</text>
  <text x="107" y="68" font-family="Courier New, monospace" font-size="11" fill="#333" text-anchor="middle" dominant-baseline="middle">return View(employee);</text>

  <!-- 矢印 -->
  <line x1="207" y1="65" x2="290" y2="65" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 右ボックス: View -->
  <rect x="295" y="10" width="195" height="110" rx="4" fill="#f8cecc" stroke="#b85450" stroke-width="1.5"/>
  <rect x="295" y="10" width="195" height="28" rx="4" fill="#b85450"/>
  <text x="392" y="24" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle" dominant-baseline="middle">View (@model Employee)</text>
  <text x="313" y="53" font-family="Courier New, monospace" font-size="10" fill="#333" dominant-baseline="middle">@Model.Id</text>
  <text x="390" y="53" font-family="Arial, sans-serif" font-size="10" fill="#555" dominant-baseline="middle">→ employee.Id</text>
  <line x1="295" y1="65" x2="490" y2="65" stroke="#b85450" stroke-width="0.75" stroke-dasharray="4,3"/>
  <text x="313" y="80" font-family="Courier New, monospace" font-size="10" fill="#333" dominant-baseline="middle">@Model.Name</text>
  <text x="390" y="80" font-family="Arial, sans-serif" font-size="10" fill="#555" dominant-baseline="middle">→ employee.Name</text>
  <line x1="295" y1="92" x2="490" y2="92" stroke="#b85450" stroke-width="0.75" stroke-dasharray="4,3"/>
  <text x="313" y="107" font-family="Courier New, monospace" font-size="10" fill="#999" dominant-baseline="middle">@Model.xxx ...</text>
</svg>
