<svg xmlns="http://www.w3.org/2000/svg" width="480" height="415" viewBox="0 0 480 415">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#555"/>
    </marker>
  </defs>
  <!-- ブラウザ (top) -->
  <rect x="130" y="15" width="220" height="40" rx="20" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="240" y="35" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#333" text-anchor="middle" dominant-baseline="middle">ブラウザ</text>
  <!-- Arrow 1 -->
  <line x1="240" y1="57" x2="240" y2="87" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="248" y="68" font-family="Arial, sans-serif" font-size="10" fill="#555" text-anchor="start">GET /Employee</text>
  <!-- Controller -->
  <rect x="40" y="89" width="400" height="58" rx="4" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <text x="240" y="113" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333" text-anchor="middle" dominant-baseline="middle">EmployeeController.cs の Index()</text>
  <text x="240" y="132" font-family="Arial, sans-serif" font-size="11" fill="#555" text-anchor="middle" dominant-baseline="middle">メソッドが呼ばれる</text>
  <!-- Arrow 2 -->
  <line x1="240" y1="149" x2="240" y2="183" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="248" y="161" font-family="Arial, sans-serif" font-size="10" fill="#555" text-anchor="start">SELECT id, name FROM employees</text>
  <text x="248" y="174" font-family="Arial, sans-serif" font-size="10" fill="#555" text-anchor="start">ORDER BY id</text>
  <!-- PostgreSQL -->
  <rect x="40" y="185" width="400" height="48" rx="4" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/>
  <text x="240" y="209" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333" text-anchor="middle" dominant-baseline="middle">PostgreSQL からデータが返ってくる</text>
  <!-- Arrow 3 -->
  <line x1="240" y1="235" x2="240" y2="265" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="248" y="252" font-family="Arial, sans-serif" font-size="10" fill="#555" text-anchor="start">List&lt;Employee&gt; を View に渡す</text>
  <!-- View -->
  <rect x="40" y="267" width="400" height="58" rx="4" fill="#f8cecc" stroke="#b85450" stroke-width="1.5"/>
  <text x="240" y="290" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333" text-anchor="middle" dominant-baseline="middle">Views/Employee/Index.cshtml</text>
  <text x="240" y="309" font-family="Arial, sans-serif" font-size="11" fill="#555" text-anchor="middle" dominant-baseline="middle">が HTML を生成する</text>
  <!-- Arrow 4 -->
  <line x1="240" y1="327" x2="240" y2="357" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- ブラウザ (bottom) -->
  <rect x="130" y="359" width="220" height="40" rx="20" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="240" y="379" font-family="Arial, sans-serif" font-size="12" fill="#333" text-anchor="middle" dominant-baseline="middle">ブラウザに HTML が届き、表が表示される</text>
</svg>
